---
name: PR description

# Check that the pull request body fills the template sections in order.
# The checker self-test runs planted cases before checking the body.
'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: description (template sections)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Checker self-test
        if: github.event.pull_request.draft != true
        run: python3 -I tools/ci/pr_body_check.py --self-test
      - name: Check the description
        if: github.event.pull_request.draft != true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' \
            > "$RUNNER_TEMP/pr-body.md"
          python3 -I tools/ci/pr_body_check.py \
            --body-file "$RUNNER_TEMP/pr-body.md"
