---
name: Security Scan

'on':
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # setup-go's cache key carries no job name, so every job in the
          # repository would share one build cache entry. The two cache steps
          # below key the caches per job instead.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # `vulncheck` names this job's build cache and must differ from every
      # other job's.
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-
      # yamllint enable rule:line-length

      # The scanners come from the pinned tools module, not from `@latest`:
      # gosec v2.29.0 built with its own golang.org/x/tools v0.49.0 cannot read
      # the export data the Go 1.27.2 compiler writes and fails on every
      # package. tools/go/go.mod selects x/tools v0.50.0 for both scanners.
      - name: Install Tools
        run: >-
          go install -modfile=tools/go/go.mod
          golang.org/x/vuln/cmd/govulncheck
          github.com/securego/gosec/v2/cmd/gosec
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run gosec
        run: gosec -conf .gosec.json ./...
