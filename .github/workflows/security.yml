---
name: Security Scan

'on':
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          go-version-file: 'go.mod'
          # setup-go's cache key carries no job name, so every job in the
          # repository would share one build cache entry. The two cache steps
          # below key the caches per job instead.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        if: github.event.pull_request.draft != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # `vulncheck` names this job's build cache and must differ from every
      # other job's.
      - name: Restore Go build cache
        if: github.event.pull_request.draft != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-
      # yamllint enable rule:line-length

      # The scanners come from the pinned tools module, not from `@latest`:
      # gosec v2.29.0 built with its own golang.org/x/tools v0.49.0 cannot read
      # the export data the Go 1.27.2 compiler writes and fails on every
      # package. tools/go/go.mod selects x/tools v0.50.0 for both scanners.
      - name: Install Tools
        if: github.event.pull_request.draft != true
        run: >-
          go install -modfile=tools/go/go.mod
          golang.org/x/vuln/cmd/govulncheck
          github.com/securego/gosec/v2/cmd/gosec
      - name: Run govulncheck
        if: github.event.pull_request.draft != true
        run: govulncheck ./...
      - name: Run gosec
        if: github.event.pull_request.draft != true
        run: gosec -conf .gosec.json ./...
