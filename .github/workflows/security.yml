---
name: Security Scan

'on':
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          go-version-file: 'go.mod'
          # setup-go's cache key carries no job name, so every job in the
          # repository would share one build cache entry. The two cache steps
          # below key the caches per job instead.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        if: github.event.pull_request.draft != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # `vulncheck` names this job's build cache and must differ from every
      # other job's.
      - name: Restore Go build cache
        if: github.event.pull_request.draft != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-
      # yamllint enable rule:line-length

      # The scanners come from the pinned tools module, not from `@latest`:
      # gosec v2.29.0 built with its own golang.org/x/tools v0.49.0 cannot read
      # the export data the Go 1.27.2 compiler writes and fails on every
      # package. tools/go/go.mod selects x/tools v0.50.0 for both scanners.
      - name: Install Tools
        if: github.event.pull_request.draft != true
        run: >-
          go install -modfile=tools/go/go.mod
          golang.org/x/vuln/cmd/govulncheck
          github.com/securego/gosec/v2/cmd/gosec
      # Both scanners first run on modules planted at run time: a clean one
      # must pass and a known defect must fail with its id, so their exit
      # status on the tracked code below is trusted.
      - name: Scanner self-test
        if: github.event.pull_request.draft != true
        shell: bash
        run: |
          bin="$(go env GOPATH)/bin"
          python3 -I tools/ci/vulncheck_selftest.py \
            --govulncheck "$bin/govulncheck" --gosec "$bin/gosec"
      - name: Run govulncheck
        if: github.event.pull_request.draft != true
        run: govulncheck ./...
      - name: Run gosec
        if: github.event.pull_request.draft != true
        run: gosec -conf .gosec.json ./...

  # Gitleaks over every fetched ref, from the release binary checked against
  # its pinned sha256 (the gitleaks action needs a paid licence key for an
  # organisation). tools/ci/secret_scan.py first plants keys and an expired
  # exception and fails unless the scan blocks them; only then is the result
  # on this repository's history trusted. Exceptions are single fingerprints
  # with an expiry in .gitleaksignore.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history for secrets
        if: github.event.pull_request.draft != true
        env:
          GITLEAKS_VERSION: 8.30.1
          # yamllint disable-line rule:line-length
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download"
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --max-time 60 --output "$archive" \
            "$release/v${GITLEAKS_VERSION}/$name"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          gitleaks="$RUNNER_TEMP/gitleaks"
          test "$("$gitleaks" version)" = "$GITLEAKS_VERSION"
          python3 -I tools/ci/secret_scan.py --gitleaks "$gitleaks" --self-test
          python3 -I tools/ci/secret_scan.py --gitleaks "$gitleaks"

  # Semgrep with the repository's own rules (.semgrep.yml) in the image pinned
  # by digest; no rule pack is fetched from the registry. The scan script,
  # tools/ci/semgrep_scan.py, first replays the fixture of every rule in both
  # directions and fails unless each passes; only then is the scan of the
  # tracked Go files trusted. Its findings go to code scanning as SARIF; the
  # job still fails on any finding.
  semgrep:
    name: semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Run Semgrep rules
        if: github.event.pull_request.draft != true
        env:
          # yamllint disable-line rule:line-length
          SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
        run: |
          set -euo pipefail
          docker pull --quiet "$SEMGREP_IMAGE"
          python3 -I tools/ci/semgrep_scan.py --image "$SEMGREP_IMAGE" \
            --sarif sarif-out/semgrep.sarif
      # The run on main is the one that opens and closes the alerts of the
      # default branch.
      - name: Upload the Semgrep findings to code scanning
        if: ${{ !cancelled() && hashFiles('sarif-out/semgrep.sarif') != '' }}
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: sarif-out/semgrep.sarif
          category: semgrep

  # Trivy in the image pinned by digest, in two steps. The tracked files are
  # scanned for vulnerable Go modules, secrets and Dockerfile misconfigurations;
  # then the image the Dockerfile builds (for amd64 here; the release builds
  # it for amd64 and arm64) is scanned for vulnerable OS packages and the Go
  # modules in its binary. tools/ci/trivy_scan.py first scans a case planted
  # at run time and fails unless Trivy reports it. HIGH and CRITICAL findings
  # with a fix fail the job; no .trivyignore is read. Both reports go to code
  # scanning as SARIF; the job still fails on any finding.
  trivy:
    name: trivy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      # yamllint disable-line rule:line-length
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Scan the tracked files
        if: github.event.pull_request.draft != true
        run: |
          set -euo pipefail
          docker pull --quiet "$TRIVY_IMAGE"
          python3 -I tools/ci/trivy_scan.py --trivy "$TRIVY_IMAGE" \
            --sarif sarif-out/trivy-fs.sarif fs
      - name: Build the image
        if: github.event.pull_request.draft != true
        run: docker build --tag diallak-scan:ci .
      - name: Scan the image
        if: github.event.pull_request.draft != true
        run: >-
          python3 -I tools/ci/trivy_scan.py --trivy "$TRIVY_IMAGE"
          --sarif sarif-out/trivy-image.sarif image --image diallak-scan:ci
      - name: Upload the Trivy file findings to code scanning
        if: ${{ !cancelled() && hashFiles('sarif-out/trivy-fs.sarif') != '' }}
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: sarif-out/trivy-fs.sarif
          category: trivy/fs
      - name: Upload the Trivy image findings to code scanning
        if: ${{ !cancelled() && hashFiles('sarif-out/trivy-image.sarif') != '' }}
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: sarif-out/trivy-image.sarif
          category: trivy/image
