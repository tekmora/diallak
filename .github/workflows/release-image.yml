---
# Builds, signs and attests the container image of one release tag.
#
# This is a reusable workflow on purpose. The supply chain level this repository
# declares (SLSA Build Level 3) needs the build and its provenance to run
# isolated from the workflow that starts them: the job below builds the image
# and attests it itself, and takes no artefact from another job.
name: release image

'on':
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, vX.Y.Z
        required: true
        type: string
    outputs:
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.image.outputs.digest }}
      sbom-pattern:
        description: Pattern of the workflow artifacts that hold the SBOMs
        value: ${{ jobs.image.outputs.sbom-pattern }}

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build, sign, attest
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      sbom-pattern: ${{ steps.names.outputs.sbom_pattern }}
    # An action pinned to a commit, with its version as a comment, runs past
    # 80 columns, so yamllint's line-length rule is off from here to the end
    # of the file.
    # yamllint disable rule:line-length
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Derive names from the tag
        id: names
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like vX.Y.Z"; exit 1 ;;
          esac
          {
            echo "sbom_amd64=diallak-${TAG#v}-linux-amd64.spdx.json"
            echo "sbom_arm64=diallak-${TAG#v}-linux-arm64.spdx.json"
            echo "sbom_pattern=diallak-${TAG#v}-linux-*.spdx.json"
          } >> "$GITHUB_OUTPUT"
      # Base images on docker.io come through mirror.gcr.io: the anonymous pull
      # limit of Docker Hub is shared by every job on a hosted runner address.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Semver tags only. There is no floating `latest`, so every
          # deployment pins what it runs.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=diallak
            org.opencontainers.image.licenses=EUPL-1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          # The Dockerfile compiles for the target platform on the runner's
          # own platform, so arm64 needs no emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # The digest names the index of both platforms. --recursive signs the
      # index and each platform image, so a pull by either digest verifies.
      - name: Sign the image (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # One SBOM per platform. The scanner reads the image of the runner's
      # platform from an index unless SYFT_PLATFORM names another; the action
      # passes its environment on to the scanner. Tried with syft v1.54.0, the
      # version this action installs, against a local build of both platforms.
      # The SBOMs leave as workflow artifacts. The caller attaches them to the
      # release, so this job needs no write access to the repository contents.
      - name: SBOM (SPDX), linux/amd64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          artifact-name: ${{ steps.names.outputs.sbom_amd64 }}
          output-file: ${{ steps.names.outputs.sbom_amd64 }}
          upload-release-assets: false
      - name: SBOM (SPDX), linux/arm64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          artifact-name: ${{ steps.names.outputs.sbom_arm64 }}
          output-file: ${{ steps.names.outputs.sbom_arm64 }}
          upload-release-assets: false
