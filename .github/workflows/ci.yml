---
name: CI

# The triggers and the first step of each job follow the engine's hosted gate
# shape: a push runs on main only, and a draft pull request fails each check in
# its first step instead of running the job. Marking the draft ready starts the
# run that replaces the failure.
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        if: github.event.pull_request.draft != true
        run: go build ./...
      - name: Vet
        if: github.event.pull_request.draft != true
        run: go vet ./...
      # The profile declares golangci-lint; .golangci.yml selects the linters
      # and the gofmt formatter.
      # The script lints planted defects first and fails unless each is found.
      - name: Lint
        if: github.event.pull_request.draft != true
        shell: bash
        env:
          GOLANGCI_LINT_VERSION: 2.14.0
          # yamllint disable-line rule:line-length
          GOLANGCI_LINT_SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
        run: |
          set -euo pipefail
          name="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          url="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${name}.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --max-time 60 --output "$RUNNER_TEMP/golangci-lint.tar.gz" "$url"
          echo "${GOLANGCI_LINT_SHA256}  $RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$RUNNER_TEMP" "${name}/golangci-lint"
          golangci_lint="$RUNNER_TEMP/${name}/golangci-lint"
          "$golangci_lint" version | grep --fixed-strings "version ${GOLANGCI_LINT_VERSION} "
          python3 -I tools/ci/lint_scan.py --golangci-lint "$golangci_lint" --self-test
          python3 -I tools/ci/lint_scan.py --golangci-lint "$golangci_lint"
      - name: Test
        if: github.event.pull_request.draft != true
        run: go test -race ./...
      # disgo v0.19.6 races its own heartbeat field on close
      # (gateway/gateway.go:317 and :451), so the race build leaves out the
      # tests that run the real gateway client; this step runs them.
      - name: Gateway health tests
        if: github.event.pull_request.draft != true
        run: go test -count=1 -run 'TestRun_.*Readyz' ./cmd/diallak/
      # The release workflow refuses a tag without a changelog section through
      # this script, so its refusals are tested on every change.
      - name: Release notes script
        if: github.event.pull_request.draft != true
        run: sh .github/scripts/release-notes_test.sh

  governance:
    name: governance (praetor)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          go-version-file: go.mod
          cache: false
      # PRAETOR_REF is the repository's engine pin: the git hooks and make read
      # it from here (.config/lefthook/engine.sh) and run the same engine CI
      # installs. One value only. The install lines run past 80 columns, so
      # yamllint's line-length rule is off for this step alone.
      # yamllint disable rule:line-length
      - name: Install praetorctl
        if: github.event.pull_request.draft != true
        env:
          PRAETOR_REF: 3bbde07342bdece12c46f74b0ee2c1f51129478f
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # yamllint enable rule:line-length
      - name: Context integrity
        if: github.event.pull_request.draft != true
        run: praetorctl compile-context --verify
      - name: HISS audit
        if: github.event.pull_request.draft != true
        run: praetorctl audit
      # REUSE lint (reuse.yml) runs the action below on the tree. These steps
      # run the same pinned action on two roots planted from REUSE.toml: one
      # clean, one with a file whose header names a licence missing from
      # LICENSES/. The job fails unless the first passes and the second fails.
      - name: Plant REUSE cases
        if: github.event.pull_request.draft != true
        shell: bash
        run: |
          set -euo pipefail
          for case in clean missing; do
            mkdir -p ".reuse-planted/$case/LICENSES"
            cp REUSE.toml ".reuse-planted/$case/"
            cp LICENSES/EUPL-1.2.txt ".reuse-planted/$case/LICENSES/"
            printf 'plain text\n' > ".reuse-planted/$case/note.txt"
          done
          # The markers keep REUSE from reading the planted tag as this file's.
          # REUSE-IgnoreStart
          printf '// SPDX-License-Identifier: MIT\npackage planted\n' \
            > .reuse-planted/missing/planted.go
          # REUSE-IgnoreEnd
      - name: REUSE lint on the clean case
        id: reuse-clean
        if: github.event.pull_request.draft != true
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6
        with:
          args: --root .reuse-planted/clean lint
      - name: REUSE lint on the missing-licence case
        id: reuse-missing
        if: github.event.pull_request.draft != true
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6
        with:
          args: --root .reuse-planted/missing lint
      - name: REUSE planted cases behaved as required
        if: github.event.pull_request.draft != true
        shell: bash
        env:
          CLEAN: ${{ steps.reuse-clean.outcome }}
          MISSING: ${{ steps.reuse-missing.outcome }}
        run: |
          echo "clean case: $CLEAN, missing-licence case: $MISSING"
          test "$CLEAN" = success
          test "$MISSING" = failure

  # Builds the image on a runner of each architecture it is released for and
  # runs it there without a network or configuration: the binary must start
  # and refuse to run without configuration, the image must run as 65532, and
  # the files in the image and the binary must stay under the limits below.
  # The script first plants a case for each check and fails unless each is
  # reported. The limits are about 10 % over the amd64 build of 2026-10-13
  # (13,459,649 and 11,092,128 bytes); raising one is a reviewed change.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
      MAX_IMAGE_BYTES: 14800000
      MAX_BINARY_BYTES: 12200000
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Build the image
        if: github.event.pull_request.draft != true
        run: docker build --platform "linux/$ARCH" --tag diallak-smoke:ci .
      - name: Run the image
        if: github.event.pull_request.draft != true
        run: >-
          python3 -I tools/ci/image_smoke.py
          --image diallak-smoke:ci --arch "$ARCH"
          --max-image-bytes "$MAX_IMAGE_BYTES"
          --max-binary-bytes "$MAX_BINARY_BYTES"
