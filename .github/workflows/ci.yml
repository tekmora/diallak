---
name: CI

# The triggers and the first step of each job follow the engine's hosted gate
# shape: a push runs on main only, and a draft pull request fails each check in
# its first step instead of running the job. Marking the draft ready starts the
# run that replaces the failure.
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        if: github.event.pull_request.draft != true
        run: go build ./...
      - name: Vet
        if: github.event.pull_request.draft != true
        run: go vet ./...
      # The profile declares golangci-lint; .golangci.yml selects the linters.
      # The script lints planted defects first and fails unless each is found.
      - name: Lint
        if: github.event.pull_request.draft != true
        shell: bash
        env:
          GOLANGCI_LINT_VERSION: 2.14.0
          # yamllint disable-line rule:line-length
          GOLANGCI_LINT_SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
        run: |
          set -euo pipefail
          name="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          url="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${name}.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --max-time 60 --output "$RUNNER_TEMP/golangci-lint.tar.gz" "$url"
          echo "${GOLANGCI_LINT_SHA256}  $RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$RUNNER_TEMP" "${name}/golangci-lint"
          golangci_lint="$RUNNER_TEMP/${name}/golangci-lint"
          "$golangci_lint" version | grep --fixed-strings "version ${GOLANGCI_LINT_VERSION} "
          python3 -I tools/ci/lint_scan.py --golangci-lint "$golangci_lint" --self-test
          python3 -I tools/ci/lint_scan.py --golangci-lint "$golangci_lint"
      - name: Test
        if: github.event.pull_request.draft != true
        run: go test -race ./...
      # The release workflow refuses a tag without a changelog section through
      # this script, so its refusals are tested on every change.
      - name: Release notes script
        if: github.event.pull_request.draft != true
        run: sh .github/scripts/release-notes_test.sh

  governance:
    name: governance (praetor)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          go-version-file: go.mod
          cache: false
      # PRAETOR_REF is the repository's engine pin: the git hooks and make read
      # it from here (.config/lefthook/engine.sh) and run the same engine CI
      # installs. One value only. The install lines run past 80 columns, so
      # yamllint's line-length rule is off for this step alone.
      # yamllint disable rule:line-length
      - name: Install praetorctl
        if: github.event.pull_request.draft != true
        env:
          PRAETOR_REF: 3bbde07342bdece12c46f74b0ee2c1f51129478f
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # yamllint enable rule:line-length
      - name: Context integrity
        if: github.event.pull_request.draft != true
        run: praetorctl compile-context --verify
      - name: HISS audit
        if: github.event.pull_request.draft != true
        run: praetorctl audit
