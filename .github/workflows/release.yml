---
# Runs when a version tag vX.Y.Z is pushed, or by hand for an existing tag.
# Merging this file releases nothing.
#
# The release is prepared before the tag exists: `praetorctl release` renders
# the changelog fragments into CHANGELOG.md on a branch, that branch is merged,
# and the merged commit is tagged. This workflow refuses a tag whose version
# has no section in CHANGELOG.md. The image is built, signed and attested by
# release-image.yml; this workflow then publishes the release with its notes
# and the SBOM. Every `uses:` is pinned to a commit.
name: release

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, vX.Y.Z
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve tag and release notes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      # Nothing is built for a version the changelog does not describe.
      - name: Require a changelog section for the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: >-
          sh .github/scripts/release-notes.sh "${TAG#v}" CHANGELOG.md
          > /dev/null

  image:
    name: image
    needs: meta
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}

  publish:
    name: publish release
    needs: [meta, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ${{ needs.image.outputs.sbom-pattern }}
          merge-multiple: true
          path: sbom
      # A rebuild of an existing tag keeps its release and replaces the SBOMs.
      - name: Publish the release with its notes and the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          sh .github/scripts/release-notes.sh "${TAG#v}" CHANGELOG.md > notes.md
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" sbom/*.spdx.json --clobber
