---
version: 1
repository:
  owner: tekmora
  name: diallak
  visibility: public
  description: "Diallak, the community bot for the Lusoris Discord hub: support, bug reports, votes and cited answers from project docs"
  homepage: ""
  topics:
    - discord-bot
    - community
    - documentation
    - retrieval
    - go
profiles:
  - app-service
facets:
  - security:high
  - agent:sandboxed
# The clients and editors in use on this project. Files for every other one are not generated
# and not verified. Add an id here before adding its files.
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
# Overrides only raise strictness, except the explicit review mode below, which permits
# single-maintainer operation as in cordanaLLM/praetor and lusoris/SnatchArr. Owner-approved by the
# standing policy for solo repositories of 2026-10-09, applied here on 2026-10-10. Restore
# independent review when a second maintainer or a review bot can approve; the required count stays
# so that restoration keeps the minimum.
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    review_mode: single_maintainer
    dismiss_stale_reviews: true
    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true
register:
  sources:
    expected: 13
    sha256:
      sha256:5920eba24d8390eaddaa07c86cfbf524cceda820a242c8826580f6c9e9b9453d
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
